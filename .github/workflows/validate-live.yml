name: Live validation (temporary, pre-merge)

# Temporary harness: workflow_dispatch only registers once a workflow
# reaches the default branch, so this push-triggered twin runs the same
# live validation from the feature branch. Deleted after validation.

on:
  push:
    branches: [claude/repo-cleanup-public-eavch1]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Live API smoke tests
        run: pytest -m live -v
      - name: Dry run for 2026-08-09
        run: python scripts/nightly_royals.py --date 2026-08-09 --dry-run
