name: Publish reports site

on:
  push:
    branches: [main]
    paths:
      - "reports/royals/daily/**"
      - "data/processed/royals/gamelog_*.csv"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  schedule:
    # 16:00 UTC. The Routine commits with [skip ci], which suppresses the push
    # trigger above, so new reports reach the site only on this rebuild. Its
    # 13:00 run has fired as late as 13:48 and pushed at 13:59, so the old
    # 14:00 slot left a one-minute margin; 16:00 gives the Routine ~3 hours.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with site dependencies
        run: pip install -e ".[site]"
      - name: Build site
        run: python scripts/build_site.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
