name: Pipeline health

on:
  schedule:
    # 17:00 UTC — after all three stages have had their turn for the day
    # (stat pack ~08:30, report Routine ~13:00, site rebuild 16:00).
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -e .
      - name: Check the pipeline end to end
        run: python scripts/pipeline_health.py
