[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baseball-lab"
version = "0.1.0"
description = "Baseball analytics lab — reusable modules for analysis and exploration"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ideksec" }]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.urls]
Repository = "https://github.com/ideksec/Baseball-Thoughts"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Notebook data literals are clearer as one row per line, even when long.
"notebooks/**/*.ipynb" = ["E501"]
# The template pre-imports the standard analysis stack for convenience.
"notebooks/templates/*.ipynb" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
